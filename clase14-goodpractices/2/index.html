<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito de compras</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th { background: #333; color: white; }
    tr:last-child td { border-bottom: none; }
    .total-row td {
      font-weight: bold;
      font-size: 1.1em;
      background: #f0f0f0;
    }
    #total { color: #e74c3c; }
  </style>
</head>
<body>

  <h1>Mi carrito</h1>

  <table>
    <thead>
      <tr>
        <th>Producto</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Subtotal</th>
      </tr>
    </thead>
    <tbody id="filas-carrito">
      <!-- Las filas se generan con JS -->
    </tbody>
    <tfoot>
      <tr class="total-row">
        <td colspan="3">Total</td>
        <td id="total">$0</td>
      </tr>
    </tfoot>
  </table>

  <script>
    // Los productos del carrito
    // BUG: una de las propiedades tiene un nombre incorrecto
    const carrito = [
      { nombre: "Remera",   precio: 1500, cantidad: 2 },
      { nombre: "Pantalón", precio: 3200, cantidad: 1 },
      { nombre: "Medias",   precio: 400,  cantidad: 3 },  // <-- ¿lo ves? -> Si, el error estaba en que cantidad estaba mal escrito (cantdad)
    ];


    // Calcula el total sumando precio × cantidad de cada item
    function calcularTotal(items) {
      let total = 0;

      for (const item of items) {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
      }

      return total;
    }

    // Genera las filas de la tabla
    function renderizarCarrito(items) {
      const tbody = document.getElementById("filas-carrito");

      for (const item of items) {
        const subtotal = item.precio * item.cantidad;
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${item.nombre}</td>
          <td>$${item.precio.toLocaleString("es-AR")}</td>
          <td>${item.cantidad}</td>
          <td>$${(subtotal || 0).toLocaleString("es-AR")}</td>
        `;
        tbody.appendChild(fila);
      }
    }

    // Muestra el total en la página
    function mostrarTotal(total) {
      document.getElementById("total").textContent =
        "$" + total.toLocaleString("es-AR");
    }

    // Punto de entrada
    renderizarCarrito(carrito);
    const total = calcularTotal(carrito);
    mostrarTotal(total);
  </script>

</body>
</html>
