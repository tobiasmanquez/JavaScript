<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traer un dato</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 420px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    button {
      font-size: 1rem;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
    }

    #ficha {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    #ficha:empty {
      display: none;
    }
  </style>
</head>

<body>
  <h1>Ficha del jugador</h1>

  <button id="cargar">Cargar jugador</button>
  <div id="ficha"></div>

  <script>
    const boton = document.querySelector("#cargar");
    const ficha = document.querySelector("#ficha");

    boton.addEventListener("click", async () => {
      // TODO 1: hacer fetch del archivo "data/jugador.json" y esperar la respuesta

      const respuesta = await fetch("data/jugador.json")
      // (acordate: fetch necesita Live Server, no funciona con doble clic / file://)

      // TODO 2: convertir el cuerpo de la respuesta a objeto con .json()
      const jugador = await respuesta.json();

      // TODO 3: pintar en #ficha el nombre, la posición, el número y el club.

      ficha.innerHTML =
        `<strong>${jugador.nombre}</strong><br>
  ${jugador.posicion} · #${jugador.numero} · ${jugador.club}`;

      //ficha.textContent = (`Nombre: ${jugador.nombre} - Posicion: ${ugador.posicion} - Numero: ${jugador.numero} - Club: ${jugador.club}`)
      // Ejemplo de salida:
      //   Lionel Messi
      //   Delantero · #10 · Inter Miami
    });
  </script>
</body>

</html>
